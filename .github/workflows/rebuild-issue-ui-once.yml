name: Rebuild issue split UI once
on:
  push:
    branches: [semes]
    paths:
      - .github/workflows/rebuild-issue-ui-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build packaged frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:offline
      - name: Commit packaged frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist/standalone
          if ! git diff --cached --quiet; then
            git commit -m "build: rebuild standalone UI for issue split"
            git push origin HEAD:semes
          fi
