openapi: 3.0.3
info:
  title: ReqOps workflow v2
  version: 2.0.0
paths:
  /api/v2/projects/{projectId}/requirements/{requirementId}/bundle:
    get:
      summary: 현재 작업 묶음과 4단계 진행 상태 조회
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: requirementId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: userId, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: current bundle}
  /api/v2/projects/{projectId}/requirements/{requirementId}/confirm:
    post:
      summary: 명시한 합의 스냅샷으로 요구사항을 원자 확정
      responses:
        '200': {description: confirmed}
        '409': {description: stale revision, consensus mismatch, or unresolved blockers}
  /api/v2/projects/{projectId}/requirements/{requirementId}/bundle/confirm:
    post:
      summary: 현재 이슈와 정확히 네 종류 산출물을 원자 확정
      responses:
        '200': {description: confirmed manifest}
        '409': {description: incomplete or stale bundle}
components:
  schemas:
    Error:
      type: object
      required: [message]
      properties: {message: {type: string}}
