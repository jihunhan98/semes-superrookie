<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReqOps — Tasks 디자인 미리보기</title>
<style>
:root{color-scheme:light;--bg:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--soft:#f4f4f5;--radius:6px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-height:34px;padding:6px 11px;white-space:nowrap;transition:background .15s}button:hover{background:var(--soft)}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #52525b;outline-offset:3px}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}header{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}.brand{display:flex;gap:11px;align-items:center;font-weight:650;letter-spacing:-.5px;font-size:18px}.mark{background:#18181b;color:white;width:27px;height:27px;border-radius:7px;display:grid;place-items:center;font-size:17px}.crumb{display:flex;gap:18px;align-items:center}.slash{color:#d4d4d8;font-weight:300;font-size:23px}.workspace{font-size:13px;color:#52525b}.demo{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:5px;letter-spacing:.06em}main{max-width:1400px;padding:48px 48px 24px;margin:auto}.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}h1{font-size:29px;letter-spacing:-1.1px;line-height:1.25;margin:0 0 9px;font-weight:650}.subtitle{margin:0;color:var(--muted);font-size:14px}.avatar{width:36px;height:36px;background:var(--soft);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}.search{height:34px;border:1px solid var(--line);border-radius:6px;padding:6px 11px;width:270px;background:white}.search::placeholder{color:#71717a}.filter{border-style:dashed}.filter select{border:0;background:transparent;max-width:130px;font-size:13px;outline-offset:5px}.filter:has(select:focus-visible){outline:2px solid #52525b;outline-offset:2px}.spacer{flex:1}.primary{background:#18181b;color:white;border-color:#18181b}.primary:hover{background:#303035}.ghost{border-color:transparent;background:transparent;color:var(--muted)}.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{height:44px;font-weight:500;color:var(--muted);font-size:13px}td{height:57px;border-top:1px solid var(--line);font-size:13px}th,td{padding:0 14px}th:first-child,td:first-child{width:42px;padding-right:0}th:last-child,td:last-child{padding-left:0;width:45px}tbody tr:hover{background:#fafafa}tbody tr.selected{background:var(--soft)}input[type=checkbox]{width:15px;height:15px;accent-color:#18181b;vertical-align:middle;cursor:pointer}.id{font-size:12px;font-weight:500;color:#52525b;width:125px}.title-cell{min-width:350px}.title-content{display:flex;align-items:center;gap:10px}.badge{border:1px solid var(--line);border-radius:5px;font-size:11px;font-weight:500;padding:1px 7px;flex-shrink:0}.task-title{max-width:520px;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:500}.status{display:flex;gap:8px;align-items:center;min-width:105px}.status svg{color:var(--muted)}.sort{border:0;background:transparent;padding:5px 0;min-height:30px;color:var(--muted);font-size:13px}.sort:hover{background:transparent;color:var(--text)}.icon-btn{width:30px;height:30px;min-height:30px;padding:5px;border-color:transparent}.pagination{display:flex;align-items:center;gap:24px;margin-top:20px;font-size:12px}.selection{color:var(--muted);margin-right:auto}.page-size{display:flex;gap:12px;align-items:center;font-weight:500}.page-size select{border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:white;height:32px}.paging{display:flex;gap:8px}.paging button{width:32px;min-height:32px;padding:6px}.page-label{min-width:90px;text-align:center;font-weight:500}.footnote{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:56px;padding-top:18px;font-size:11px;color:var(--muted)}.footnote a{color:inherit;text-underline-offset:3px}.empty{text-align:center;height:180px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;width:440px;max-width:calc(100% - 32px);box-shadow:0 16px 60px #0002}dialog::backdrop{background:#0005}dialog h2{margin:0 0 8px;font-size:21px;letter-spacing:-.6px}dialog p{color:var(--muted);font-size:13px}dialog label{display:block;margin:20px 0 7px;font-weight:500}dialog input,dialog select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:white}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:26px}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}@media(min-width:1500px){main{padding-top:64px}}@media(max-width:800px){header{padding:0 20px}main{padding:30px 20px}.intro{margin-bottom:26px}h1{font-size:26px}.search{flex:1;min-width:180px}.toolbar .spacer{display:none}.toolbar .primary{margin-left:auto}.pagination{flex-wrap:wrap;gap:16px}.selection{width:100%}.page-size{margin-right:auto}.footnote{gap:15px;flex-wrap:wrap;margin-top:36px}.workspace{display:none}.slash{display:none}.task-title{max-width:380px}button{min-height:44px}.filter{min-height:44px}.search{height:44px}.paging button,.icon-btn{min-height:44px;min-width:44px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="crumb"><div class="brand"><span class="mark" aria-hidden="true">r</span>ReqOps</div><span class="slash">/</span><span class="workspace">SEMES VCS 프로젝트</span></div><span class="demo">DESIGN PREVIEW</span></header>
<main>
<section class="intro"><div><h1>요구사항</h1><p class="subtitle">프로젝트의 요구사항을 한곳에서 검토하고 관리하세요.</p></div><div class="avatar" aria-label="데모 사용자 한지훈">JH</div></section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="요구사항 검색..." aria-label="요구사항 검색"><div class="filter" style="display:flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:6px;padding:6px 10px"><span data-icon="plusCircle"></span><select id="status" aria-label="상태 필터"><option value="">상태</option><option>접수</option><option>검토 중</option><option>합의 대기</option><option>확정</option><option>보류</option></select></div><div class="filter" style="display:flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:6px;padding:6px 10px"><span data-icon="plusCircle"></span><select id="priority" aria-label="우선순위 필터"><option value="">우선순위</option><option>높음</option><option>보통</option><option>낮음</option></select></div><button id="reset" class="ghost" hidden>초기화 <span data-icon="x"></span></button><span class="spacer"></span><button id="add" class="primary"><span data-icon="plus"></span>요구사항 추가</button></div>
<div class="table-wrap"><table aria-label="더미 요구사항 목록"><thead><tr><th><input type="checkbox" id="all" aria-label="현재 페이지 전체 선택"></th><th>요구사항 ID</th><th aria-sort="none" id="title-head"><button class="sort" id="sort">제목 <span data-icon="sort"></span></button></th><th>상태</th><th>우선순위</th><th><span style="position:absolute;width:1px;height:1px;overflow:hidden">상세</span></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><span id="selection" class="selection" aria-live="polite"></span><label class="page-size">페이지당 행 수 <select id="size"><option>10</option><option>20</option><option>30</option></select></label><span class="page-label" id="page" aria-live="polite"></span><div class="paging"><button id="first" aria-label="첫 페이지"><span data-icon="first"></span></button><button id="prev" aria-label="이전 페이지"><span data-icon="left"></span></button><button id="next" aria-label="다음 페이지"><span data-icon="right"></span></button><button id="last" aria-label="마지막 페이지"><span data-icon="last"></span></button></div></div>
<footer class="footnote"><span>미리보기용 더미 데이터입니다. 변경사항은 새로고침하면 초기화됩니다.</span><a href="https://ui.shadcn.com/examples/tasks" target="_blank" rel="noreferrer">Design reference: shadcn/ui Tasks ↗</a></footer>
</main>
<dialog id="editor" aria-labelledby="dialog-title"><form id="form"><h2 id="dialog-title">요구사항 추가</h2><p>디자인 확인을 위한 예시 항목을 추가합니다.</p><label for="new-title">제목</label><input id="new-title" required maxlength="140" placeholder="요구사항 내용을 입력하세요"><div class="dialog-grid"><div><label for="new-status">상태</label><select id="new-status"><option>접수</option><option>검토 중</option><option>합의 대기</option><option>확정</option><option>보류</option></select></div><div><label for="new-priority">우선순위</label><select id="new-priority"><option>보통</option><option>높음</option><option>낮음</option></select></div></div><div class="dialog-actions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">추가하기</button></div></form></dialog>
<dialog id="detail" aria-labelledby="detail-title"><h2 id="detail-title">요구사항 상세</h2><p id="detail-id"></p><p id="detail-text" style="font-size:16px;color:var(--text);line-height:1.8"></p><p id="detail-meta"></p><div class="dialog-actions"><button id="close-detail">닫기</button></div></dialog>
<script>
const shapes={plus:'M12 5v14M5 12h14',plusCircle:'M12 8v8M8 12h8',x:'m6 6 12 12M6 18 18 6',sort:'m8 4-3 3-3-3M5 7v13m11 0 3-3 3 3M19 17V4',left:'m14 6-6 6 6 6',right:'m10 6 6 6-6 6',first:'m16 6-6 6 6 6M5 5v14',last:'m8 6 6 6-6 6M19 5v14',more:'M5 12h.01M12 12h.01M19 12h.01',todo:'',review:'M12 8v4l3 2',wait:'M8 9h8M8 15h8',done:'m8 12 3 3 5-6',hold:'m8 8 8 8M8 16l8-8',up:'M12 19V5m-5 5 5-5 5 5',medium:'M5 12h14m-4-4 4 4-4 4',down:'M12 5v14m-5-5 5 5 5-5'};
function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(['plusCircle','todo','review','wait','done','hold'].includes(name)?'<circle cx="12" cy="12" r="9"/>':'')+'<path d="'+shapes[name]+'"/></svg>'}document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const seeds=[['태스크 할당 시 가용 AMR의 배터리 잔량을 확인한다','기능','검토 중','높음'],['동일 자재 ID에 대한 중복 이송 요청을 제한한다','기능','접수','높음'],['경로 탐색 실패 시 대체 경로를 재탐색한다','기능','합의 대기','보통'],['AMR 통신 단절 시 상위 시스템으로 알람을 전송한다','안정성','검토 중','높음'],['작업 완료 이력의 조회 조건과 보관 기간을 정의한다','문서','확정','보통'],['운영 화면에 로봇별 현재 위치와 작업 상태를 표시한다','기능','확정','보통'],['긴급 정지 이후 작업 재개 조건을 정의한다','안정성','보류','높음'],['태스크 우선순위 변경 시 대기열을 재정렬한다','기능','접수','보통'],['충전 스테이션 진입 및 이탈 조건을 명확히 한다','기능','합의 대기','낮음'],['호스트 인터페이스의 응답 타임아웃 기준을 정의한다','성능','검토 중','높음'],['이송 요청 취소 시 진행 중인 작업의 처리 방식을 정의한다','기능','접수','보통'],['맵 업데이트 시 운행 중인 로봇의 경로를 검증한다','안정성','확정','높음'],['사용자별 작업 이력 조회 권한을 구분한다','기능','검토 중','낮음'],['장비 상태 메시지의 전송 주기를 정의한다','성능','합의 대기','보통'],['예외 상황별 복구 절차를 운영 문서에 기록한다','문서','접수','낮음'],['교차 구간에서 AMR 간 진입 우선순위를 적용한다','기능','검토 중','높음'],['프로브 카드 인계 완료 신호를 검증한다','안정성','확정','높음'],['대시보드의 통계 집계 기준을 명시한다','문서','접수','낮음'],['대기 작업이 없는 AMR의 복귀 위치를 설정한다','기능','보류','보통'],['이송 지연 알림의 발생 조건을 정의한다','성능','접수','보통'],['시스템 재시작 시 미완료 작업을 복원한다','안정성','검토 중','높음'],['운영 파라미터 변경 이력을 저장한다','문서','확정','보통'],['수동 운전 전환 시 자동 할당을 중지한다','기능','합의 대기','높음'],['작업별 소요 시간과 대기 시간을 분리 집계한다','성능','접수','낮음']];
let data=seeds.map((r,i)=>({id:'REQ-'+String(1001+i),title:r[0],type:r[1],status:r[2],priority:r[3]})),page=1,ascending=null;const selected=new Set(),$=id=>document.getElementById(id),statusIcon={'접수':'todo','검토 중':'review','합의 대기':'wait','확정':'done','보류':'hold'},priorityIcon={'높음':'up','보통':'medium','낮음':'down'};function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filtered(){let a=data.filter(r=>(r.title+' '+r.id).toLowerCase().includes($('search').value.toLowerCase())&&(!$('status').value||r.status===$('status').value)&&(!$('priority').value||r.priority===$('priority').value));if(ascending!==null)a.sort((a,b)=>(ascending?1:-1)*a.title.localeCompare(b.title,'ko'));return a}function render(){const a=filtered(),size=+$('size').value,pages=Math.max(1,Math.ceil(a.length/size));page=Math.min(page,pages);const visible=a.slice((page-1)*size,page*size);$('rows').innerHTML=visible.map(r=>'<tr class="'+(selected.has(r.id)?'selected':'')+'"><td><input type="checkbox" data-check="'+r.id+'" aria-label="'+r.id+' 선택" '+(selected.has(r.id)?'checked':'')+'></td><td class="id">'+r.id+'</td><td class="title-cell"><div class="title-content"><span class="badge">'+r.type+'</span><span class="task-title">'+escapeHtml(r.title)+'</span></div></td><td><span class="status">'+icon(statusIcon[r.status])+r.status+'</span></td><td><span class="status">'+icon(priorityIcon[r.priority])+r.priority+'</span></td><td><button class="icon-btn" data-detail="'+r.id+'" aria-label="'+r.id+' 상세 보기">'+icon('more')+'</button></td></tr>').join('')||'<tr><td colspan="6" class="empty">검색 조건에 맞는 요구사항이 없습니다.</td></tr>';$('selection').textContent=a.length+'개 중 '+a.filter(r=>selected.has(r.id)).length+'개 선택';$('page').textContent=page+' / '+pages+' 페이지';$('first').disabled=$('prev').disabled=page===1;$('next').disabled=$('last').disabled=page===pages;$('all').checked=visible.length>0&&visible.every(r=>selected.has(r.id));$('all').indeterminate=visible.some(r=>selected.has(r.id))&&!$('all').checked;$('all').disabled=!visible.length;$('reset').hidden=!($('search').value||$('status').value||$('priority').value)}
['search','status','priority','size'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=1;render()}));$('reset').onclick=()=>{['search','status','priority'].forEach(id=>$(id).value='');page=1;render()};$('sort').onclick=()=>{ascending=ascending===null?true:!ascending;$('title-head').setAttribute('aria-sort',ascending?'ascending':'descending');render()};$('first').onclick=()=>{page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('last').onclick=()=>{page=Math.max(1,Math.ceil(filtered().length/+$('size').value));render()};$('all').onchange=e=>{filtered().slice((page-1)*+$('size').value,page*+$('size').value).forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));render()};$('rows').onchange=e=>{const id=e.target.dataset.check;if(id){e.target.checked?selected.add(id):selected.delete(id);render()}};$('rows').onclick=e=>{const b=e.target.closest('[data-detail]');if(!b)return;const r=data.find(r=>r.id===b.dataset.detail);$('detail-id').textContent=r.id+' / '+r.type;$('detail-text').textContent=r.title;$('detail-meta').textContent=r.status+' · 우선순위 '+r.priority+' · 데모 데이터';$('detail').showModal()};$('close-detail').onclick=()=>$('detail').close();$('add').onclick=()=>$('editor').showModal();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();const title=$('new-title').value.trim();if(!title){$('new-title').focus();return}data.unshift({id:'REQ-'+(1001+data.length),title,type:'기능',status:$('new-status').value,priority:$('new-priority').value});['search','status','priority'].forEach(id=>$(id).value='');ascending=null;$('title-head').setAttribute('aria-sort','none');page=1;$('form').reset();$('editor').close();render()};render();
</script>
</body>
</html>
