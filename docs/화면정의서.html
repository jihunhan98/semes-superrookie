<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요구사항 엔지니어링 — 화면 정의서</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:#f6f8fa;color:#1f2328;display:flex;flex-direction:column;height:100vh;}
  .bar{flex:0 0 auto;background:#24292f;display:flex;align-items:center;gap:6px;padding:0 18px;height:54px;}
  .bar .ttl{color:#fff;font-weight:800;font-size:15px;margin-right:14px;display:flex;align-items:center;gap:9px;}
  .bar .ttl .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6e40c9,#0969da);display:grid;place-items:center;font-size:12px;}
  .bar button{background:transparent;border:0;color:#adbac7;font-weight:700;font-size:14px;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:inherit;}
  .bar button:hover{background:#31363d;color:#fff;}
  .bar button.on{background:#316dca;color:#fff;}
  iframe{flex:1;width:100%;border:0;background:#fff;}
</style>
</head>
<body>
  <div class="bar">
    <span class="ttl"><span class="mk">RE</span>화면 정의서</span>
    <button class="on" data-src="screens/f1.html">기능 1 · 로그인·프로젝트</button>
    <button data-src="screens/f2.html">기능 2 · 요구사항 검토</button>
    <button data-src="screens/f3.html">기능 3 · 산출물 도출</button>
  </div>
  <iframe id="frame" src="screens/f1.html" title="화면 정의"></iframe>
  <script>
    var frame=document.getElementById('frame');
    var btns=document.querySelectorAll('.bar button');
    btns.forEach(function(b){
      b.addEventListener('click',function(){
        btns.forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');
        frame.src=b.getAttribute('data-src');
      });
    });
  </script>
</body>
</html>
