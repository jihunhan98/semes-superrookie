<div id="requirement-check-preview">
  <style>
    #requirement-check-preview{--p-bg:light-dark(#f7f8fa,#171c24);--p-surface:light-dark(#fff,#222a35);--p-text:light-dark(#172b4d,#e4eaf4);--p-muted:light-dark(#626f86,#aab8cc);--p-line:light-dark(#dfe1e6,#414c5b);--p-blue:light-dark(#0c66e4,#85b8ff);--p-soft:light-dark(#e9f2ff,#263c59);--p-warn:light-dark(#974f0c,#f5cd87);--p-warn-bg:light-dark(#fff7e5,#3c3020);--p-red:light-dark(#ae2a19,#ffb4a7);--p-red-bg:light-dark(#ffebe6,#422c2b);--p-mark:light-dark(#ffe8a3,#624c19);font:14px/1.65 Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--p-text)}
    #requirement-check-preview *{box-sizing:border-box}#requirement-check-preview button,#requirement-check-preview select{font:inherit;color:inherit;cursor:pointer}#requirement-check-preview button:focus-visible,#requirement-check-preview select:focus-visible{outline:2px solid var(--p-blue);outline-offset:3px}#requirement-check-preview .preview-options{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--p-muted);font-size:12px}#requirement-check-preview select{background:var(--p-surface);border:1px solid var(--p-line);padding:7px 10px;border-radius:4px}#requirement-check-preview .app{border:1px solid var(--p-line);border-radius:8px;background:var(--p-bg);overflow:hidden}#requirement-check-preview .appbar{display:flex;align-items:center;gap:24px;padding:12px 20px;background:var(--p-surface);border-bottom:1px solid var(--p-line)}#requirement-check-preview .brand{font-size:18px;font-weight:500;color:var(--p-blue)}#requirement-check-preview .appbar .bell{margin-left:auto;display:flex;gap:7px;align-items:center;border:1px solid var(--p-line);border-radius:4px;background:var(--p-surface);padding:6px 10px;font-size:12px}#requirement-check-preview .count{background:var(--p-blue);color:light-dark(#fff,#172b4d);border-radius:10px;padding:0 6px;font-size:11px}#requirement-check-preview .page{padding:24px}#requirement-check-preview .crumb{color:var(--p-muted);font-size:12px}#requirement-check-preview h2{margin:7px 0 18px;font-size:23px;font-weight:500}#requirement-check-preview .banner{display:flex;align-items:center;gap:18px;padding:16px;background:var(--p-warn-bg);border:1px solid color-mix(in srgb,var(--p-warn) 25%,var(--p-line));border-radius:5px}#requirement-check-preview .banner strong{font-weight:500;display:block}#requirement-check-preview .banner p{margin:3px 0 0;font-size:12px;color:var(--p-muted)}#requirement-check-preview .banner button{margin-left:auto;flex-shrink:0}#requirement-check-preview .button{background:var(--p-surface);border:1px solid var(--p-line);border-radius:4px;padding:7px 12px;white-space:nowrap}#requirement-check-preview .primary{background:var(--p-blue);border-color:var(--p-blue);color:light-dark(#fff,#172b4d)}#requirement-check-preview .req-list{margin-top:20px;background:var(--p-surface);border:1px solid var(--p-line);border-radius:5px}#requirement-check-preview .req-row{padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--p-line);font-size:13px}#requirement-check-preview .req-row:last-child{border-bottom:0}#requirement-check-preview .req-id{color:var(--p-blue);font-size:12px;min-width:48px}#requirement-check-preview .req-row .req-text{flex:1}#requirement-check-preview .req-row .hint{color:var(--p-muted);font-size:12px}#requirement-check-preview .overlay{padding:20px;background:light-dark(#e7ebf1,#10151c)}#requirement-check-preview .window{background:var(--p-surface);border-radius:7px;box-shadow:0 8px 24px #0002;overflow:hidden}#requirement-check-preview .windowhead{display:flex;align-items:start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--p-line)}#requirement-check-preview .windowhead h3{font-size:20px;font-weight:500;margin:6px 0}#requirement-check-preview .meta{font-size:12px;color:var(--p-muted)}#requirement-check-preview .close{margin-left:auto;border:0;background:none;font-size:24px;color:var(--p-muted);padding:0 5px}#requirement-check-preview .review-grid{display:grid;grid-template-columns:260px minmax(0,1fr)}#requirement-check-preview .findings{border-right:1px solid var(--p-line)}#requirement-check-preview .findings-label{padding:12px 16px;border-bottom:1px solid var(--p-line);font-size:12px;color:var(--p-muted)}#requirement-check-preview .finding{display:block;width:100%;border:0;border-bottom:1px solid var(--p-line);background:var(--p-surface);text-align:left;padding:16px;color:var(--p-text)}#requirement-check-preview .finding[aria-pressed=true]{background:var(--p-soft);box-shadow:inset 3px 0 var(--p-blue)}#requirement-check-preview .finding strong{display:block;font-weight:500;margin-top:5px;font-size:13px}#requirement-check-preview .finding small{display:block;color:var(--p-muted);font-size:12px;margin-top:5px}#requirement-check-preview .kind{display:inline-block;border-radius:3px;padding:1px 6px;background:var(--p-warn-bg);color:var(--p-warn);font-size:11px}#requirement-check-preview .kind.opposed{background:var(--p-red-bg);color:var(--p-red)}#requirement-check-preview .comparison{padding:20px 24px;min-width:0}#requirement-check-preview .comparison h4{font-size:17px;font-weight:500;margin:8px 0 18px}#requirement-check-preview .quotes{display:grid;grid-template-columns:1fr 1fr;gap:14px}#requirement-check-preview .quote{border:1px solid var(--p-line);border-radius:4px;overflow:hidden}#requirement-check-preview .quotehead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--p-bg);padding:9px 12px;font-size:12px;border-bottom:1px solid var(--p-line)}#requirement-check-preview .quotehead b{color:var(--p-blue);font-weight:500}#requirement-check-preview .quotehead span{color:var(--p-muted)}#requirement-check-preview .quote p{font-size:14px;margin:12px;line-height:1.9;overflow-wrap:anywhere}#requirement-check-preview mark{background:var(--p-mark);color:var(--p-text);padding:0 2px}#requirement-check-preview .change{font-size:12px;color:var(--p-muted);margin-bottom:14px}#requirement-check-preview .change strong{color:var(--p-text);font-weight:500}#requirement-check-preview .reason h5{font-size:13px;font-weight:500;margin:20px 0 7px}#requirement-check-preview .reason p{margin:0;font-size:13px;line-height:1.9}#requirement-check-preview .case{margin-top:12px;padding:11px 13px;border-left:3px solid var(--p-blue);background:var(--p-soft);font-size:13px}#requirement-check-preview details{margin-top:16px;font-size:12px;color:var(--p-muted)}#requirement-check-preview summary{cursor:pointer}#requirement-check-preview details p{white-space:pre-wrap;color:var(--p-text);line-height:1.9}#requirement-check-preview .windowfoot{border-top:1px solid var(--p-line);padding:14px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}#requirement-check-preview .read-state{margin-right:auto;color:var(--p-muted);font-size:12px}#requirement-check-preview .closed-note{padding:18px;text-align:center;color:var(--p-muted);font-size:12px}#requirement-check-preview [hidden]{display:none!important}@media(max-width:720px){#requirement-check-preview .page{padding:16px}#requirement-check-preview .appbar{padding:12px;gap:14px}#requirement-check-preview .appbar .nav-label{display:none}#requirement-check-preview .overlay{padding:8px}#requirement-check-preview .windowhead{padding:16px}#requirement-check-preview .review-grid{grid-template-columns:1fr}#requirement-check-preview .findings{border-right:0;border-bottom:1px solid var(--p-line)}#requirement-check-preview .finding{padding:12px 16px}#requirement-check-preview .comparison{padding:16px}#requirement-check-preview .quotes{grid-template-columns:1fr}#requirement-check-preview .windowfoot{padding:12px 16px}#requirement-check-preview .banner{align-items:flex-start;flex-wrap:wrap;gap:10px}#requirement-check-preview .banner button{margin-left:0}#requirement-check-preview .req-row{flex-wrap:wrap;gap:6px 12px}#requirement-check-preview .req-row .req-text{min-width:180px}#requirement-check-preview .req-row .hint{margin-left:60px}#requirement-check-preview .read-state{flex-basis:100%}#requirement-check-preview button{min-height:40px}}
  </style>
  <div class="preview-options"><span>UI·UX 설계안 · 예시 데이터</span><label>예시 <select id="check-scenario"><option value="update">REQ03 수정</option><option value="create">REQ11 추가</option></select></label></div>
  <div class="app">
    <header class="appbar"><span class="brand">ReqOps</span><span class="nav-label">요구사항</span><span class="nav-label">산출물</span><button class="bell" id="check-bell" aria-label="확인할 내용 알림 열기">알림 <span class="count" id="check-unread">1</span></button></header>
    <section class="page"><div class="crumb">AMR 제어 시스템 / 요구사항</div><h2>요구사항</h2><div class="banner"><div><strong id="check-banner-title">다른 요구사항과 함께 확인할 내용이 있습니다.</strong><p id="check-summary"></p></div><button class="button" id="check-open">내용 확인</button></div><div class="req-list" id="check-requirements"></div></section>
    <div class="overlay" id="check-detail"><section class="window" aria-label="요구사항 간 확인 내용"><header class="windowhead"><div><div class="crumb">요구사항 / 확인할 내용</div><h3 id="check-title"></h3><div class="meta" id="check-meta"></div></div><button class="close" id="check-close" aria-label="상세 닫기">×</button></header><div class="review-grid"><aside class="findings"><div class="findings-label">확인 항목</div><div id="check-finding-list"></div></aside><main class="comparison" id="check-comparison" aria-live="polite"></main></div><footer class="windowfoot"><span class="read-state" id="check-read-state" aria-live="polite">저장 당시의 문장을 비교한 결과입니다.</span><button class="button" id="check-footer-close">닫기</button><button class="button primary" id="check-ack">알림 확인</button></footer></section></div>
  </div>
  <script>
    (function(){
      const root=document.getElementById('requirement-check-preview');const el=id=>root.querySelector('#'+id);
      const examples={
        update:{source:'REQ03',action:'수정',version:'v2',scope:'기존 요구사항 9개 확인',change:'SOC 50% 이상 → SOC 30% 이상',sourceText:'IDLE 상태이며 SOC가 30% 이상인 AMR을 배정 후보에 포함한다.',findings:[
          {id:'REQ07',kind:'기준 불일치',title:'30% 이상~50% 미만 AMR의 후보 포함 여부가 다릅니다',source:'IDLE 상태이며 SOC가 <mark>30% 이상</mark>인 AMR을 배정 후보에 포함한다.',target:'SOC가 <mark>50% 미만</mark>인 AMR은 배정 후보에서 제외한다.',reason:'두 요구사항 모두 배정 후보를 정하는 조건입니다. REQ03은 기준을 30%로 낮췄지만, REQ07에는 50% 제외 기준이 남아 있습니다.',case:'예: IDLE · SOC 40% → REQ03에서는 포함, REQ07에서는 제외',targetText:'작업 배정 시 SOC가 50% 미만인 AMR은 배정 후보에서 제외한다.'},
          {id:'REQ09',kind:'의미 확인',title:'낮은 배터리의 범위를 확인해야 합니다',source:'IDLE 상태이며 SOC가 <mark>30% 이상</mark>인 AMR을 배정 후보에 포함한다.',target:'<mark>배터리가 낮은 AMR</mark>은 배정 후보에서 제외한다.',reason:'REQ09의 ‘낮은 배터리’에 수치 기준이 없습니다. REQ03의 30%와 같은 기준인지, 별도의 제외 조건인지 확인이 필요합니다.',case:'충돌로 확정할 수 없습니다. ‘낮은’의 범위가 정해져야 함께 적용할 수 있습니다.',targetText:'배터리가 낮은 AMR은 배정 후보에서 제외한다.'}
        ]},
        create:{source:'REQ11',action:'추가',version:'v1',scope:'기존 요구사항 10개 확인',change:'신규 등록',sourceText:'충전 중인 AMR도 긴급 작업의 배정 후보에 포함한다.',findings:[
          {id:'REQ04',kind:'동작 상충',title:'충전 중 AMR의 배정 허용 여부가 다릅니다',source:'<mark>충전 중인 AMR도</mark> 긴급 작업의 배정 후보에 포함한다.',target:'<mark>충전 중인 AMR은</mark> 모든 작업의 배정 후보에서 제외한다.',reason:'REQ11은 긴급 작업에서 충전 중 AMR을 포함하도록 하지만, REQ04는 모든 작업에서 제외하도록 합니다. 긴급 작업이 예외에 해당하는지 기존 문장에서는 확인되지 않습니다.',case:'예: 충전 중 · 긴급 작업 → REQ11에서는 포함, REQ04에서는 제외',targetText:'충전 중인 AMR은 모든 작업의 배정 후보에서 제외한다.'},
          {id:'REQ10',kind:'의미 확인',title:'긴급 작업과 일반 작업의 구분이 필요합니다',source:'충전 중인 AMR도 <mark>긴급 작업</mark>의 배정 후보에 포함한다.',target:'<mark>요청된 작업</mark>에는 동일한 후보 선정 기준을 적용한다.',reason:'REQ10은 작업 종류를 구분하지 않습니다. 신규 REQ11의 긴급 작업이 기존 공통 기준에 대한 예외인지, 별도의 작업 유형인지 확인해야 합니다.',case:'예외의 적용 범위가 명확하지 않아 함께 확인할 항목으로 표시했습니다.',targetText:'요청된 작업에는 동일한 후보 선정 기준을 적용한다.'}
        ]}
      };
      let scenario='update',selected=0,read=false;
      function detail(){const sample=examples[scenario],f=sample.findings[selected];el('check-comparison').innerHTML='<span class="kind '+(f.kind==='동작 상충'?'opposed':'')+'">'+f.kind+'</span><h4>'+f.title+'</h4><div class="change">'+sample.source+' '+sample.action+' · <strong>'+sample.change+'</strong></div><div class="quotes"><section class="quote"><div class="quotehead"><b>'+sample.source+'</b><span>'+sample.action+'한 문장 · '+sample.version+'</span></div><p>'+f.source+'</p></section><section class="quote"><div class="quotehead"><b>'+f.id+'</b><span>기존 문장 · v1</span></div><p>'+f.target+'</p></section></div><div class="reason"><h5>왜 확인해야 하나요?</h5><p>'+f.reason+'</p><div class="case">'+f.case+'</div></div><details><summary>전체 원문 보기</summary><p>'+sample.source+' · '+sample.sourceText+'</p><p>'+f.id+' · '+f.targetText+'</p></details>';Array.from(el('check-finding-list').children).forEach((button,index)=>button.setAttribute('aria-pressed',String(index===selected)));}
      function render(){const sample=examples[scenario];el('check-title').textContent=sample.source+' '+sample.action+' 후 확인할 내용';el('check-meta').textContent=sample.scope+' · 저장 당시 버전 기준';el('check-summary').textContent=sample.source+' '+sample.action+' · '+sample.scope+' · 2개 요구사항에서 2개 항목';el('check-banner-title').textContent=read?'확인한 알림입니다. 내용은 기록에 남아 있습니다.':'다른 요구사항과 함께 확인할 내용이 있습니다.';el('check-unread').hidden=read;el('check-ack').textContent=read?'확인한 알림':'알림 확인';el('check-ack').disabled=read;el('check-finding-list').innerHTML='';sample.findings.forEach((f,index)=>{const b=document.createElement('button');b.className='finding';b.type='button';b.innerHTML='<span class="req-id">'+f.id+'</span><strong>'+f.title+'</strong><small>'+f.kind+'</small>';b.onclick=()=>{selected=index;detail();};el('check-finding-list').appendChild(b);});el('check-requirements').innerHTML='<div class="req-row"><span class="req-id">'+sample.source+'</span><span class="req-text">'+sample.sourceText+'</span><span class="hint">'+sample.action+' 저장 완료</span></div>'+sample.findings.map(f=>'<div class="req-row"><span class="req-id">'+f.id+'</span><span class="req-text">'+f.targetText+'</span><span class="hint">확인할 내용'+'</span></div>').join('');detail();}
      el('check-scenario').onchange=event=>{scenario=event.target.value;selected=0;read=false;el('check-read-state').textContent='저장 당시의 문장을 비교한 결과입니다.';el('check-detail').hidden=false;render();};
      ['check-open','check-bell'].forEach(id=>el(id).onclick=()=>el('check-detail').hidden=false);
      ['check-close','check-footer-close'].forEach(id=>el(id).onclick=()=>el('check-detail').hidden=true);
      el('check-ack').onclick=()=>{read=true;el('check-read-state').textContent='알림을 확인했습니다. 요구사항 내용은 그대로 유지됩니다.';render();};render();
    })();
  </script>
</div>
