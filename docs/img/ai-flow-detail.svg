    <rect x="20" y="1988" width="1280" height="44" fill="#FFFFFF"/>
    <text class="td" x="36" y="2014" font-weight="700">문제 구절</text>
    <text class="td" x="220" y="2014">원문에서 문제가 된 부분 그대로</text>
    <rect x="20" y="2032" width="1280" height="44" fill="#F6F7F9"/>
    <text class="td" x="36" y="2058" font-weight="700">이유</text>
