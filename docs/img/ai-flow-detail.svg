<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 2640" font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b96a3"/>
    </marker>
    <style>
      .h1   { font-size:28px; font-weight:800; fill:#1B2A4A; }
      .h1s  { font-size:14px; fill:#63707E; }
      .h2   { font-size:19px; font-weight:800; }
      .h3   { font-size:14.5px; font-weight:700; fill:#1B2A4A; }
      .body { font-size:13.5px; fill:#2B3A55; }
      .mut  { font-size:12.5px; fill:#63707E; }
      .num  { font-size:15px; font-weight:800; fill:#ffffff; text-anchor:middle; }
      .box  { fill:#ffffff; stroke-width:2; rx:14; }
      .edge { stroke:#8b96a3; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .pill { font-size:12px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .th   { font-size:13px; font-weight:800; fill:#ffffff; }
      .td   { font-size:13px; fill:#2B3A55; }
      .tdm  { font-size:12px; fill:#63707E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="2640" fill="#FBFCFD"/>

  <!-- ============ Title ============ -->
  <text class="h1" x="30" y="44">AI 검토 프로세스</text>
  <text class="h1s" x="30" y="66">요구사항을 입력하면 어떤 순서로 검토되고, 화면에 어떻게 나타나는지를 정리한 흐름</text>

  <!-- ============ SECTION 1 : 최초 등록 vs 확정본 수정 ============ -->
  <text class="h2" x="30" y="112" fill="#1B2A4A">1. 언제 검토가 도나 — 최초 등록과 확정본 수정은 시작이 다르다</text>
  <text class="mut" x="30" y="132">① · ② 단계만 다르고, ③ 단계부터는 완전히 같은 방식으로 진행된다.</text>

  <!-- 컬럼 헤더 -->
  <rect x="20" y="150" width="610" height="34" rx="17" fill="#2C7A8C"/>
  <text class="pill" x="325" y="172">최초 등록</text>
  <rect x="690" y="150" width="610" height="34" rx="17" fill="#C1621B"/>
  <text class="pill" x="995" y="172">확정본 수정  ·  설계만 완료 · 개발 예정</text>

  <!-- 왼쪽 컬럼: 최초 등록 -->
  <g>
    <rect class="box" x="20" y="198" width="610" height="84" stroke="#2C7A8C"/>
    <circle cx="52" cy="228" r="14" fill="#2C7A8C"/><text class="num" x="52" y="233">1</text>
    <text class="h3" x="76" y="234">요구사항 내용을 입력한다</text>
    <text class="mut" x="76" y="256">수정 사유는 필요 없다 — 바꿀 원본이 아직 없으므로.</text>
  </g>
  <line class="edge" x1="325" y1="282" x2="325" y2="308"/>
  <g>
    <rect class="box" x="20" y="308" width="610" height="84" stroke="#2C7A8C"/>
    <circle cx="52" cy="338" r="14" fill="#2C7A8C"/><text class="num" x="52" y="343">2</text>
    <text class="h3" x="76" y="344">AI가 문장 전체를 검토한다</text>
    <text class="mut" x="76" y="366">저장과 동시에 자동으로 실행된다 — 별도로 켜고 끄는 옵션은 없다.</text>
  </g>
  <line class="edge" x1="325" y1="392" x2="325" y2="418"/>

  <!-- 오른쪽 컬럼: 확정본 수정 -->
  <g>
    <rect class="box" x="690" y="198" width="610" height="84" stroke="#C1621B"/>
    <circle cx="722" cy="228" r="14" fill="#C1621B"/><text class="num" x="722" y="233">1</text>
    <text class="h3" x="746" y="234">확정된 문장을 고치고, 수정 사유를 입력한다</text>
    <text class="mut" x="746" y="256">수정 사유는 필수 — 대부분 고객사 요청으로 바뀌기 때문.</text>
  </g>
  <line class="edge" x1="995" y1="282" x2="995" y2="308"/>
  <g>
    <rect class="box" x="690" y="308" width="610" height="84" stroke="#C1621B"/>
    <circle cx="722" cy="338" r="14" fill="#C1621B"/><text class="num" x="722" y="343">2</text>
    <text class="h3" x="746" y="344">AI가 바뀐 부분과 사유만 검토한다</text>
    <text class="mut" x="746" y="366">이미 고객과 합의된 나머지 문장은 다시 건드리지 않는다.</text>
  </g>
  <line class="edge" x1="995" y1="392" x2="995" y2="418"/>

  <!-- 여기서부터 동일 -->
  <rect x="470" y="398" width="380" height="26" rx="13" fill="#EFF1F3" stroke="#B9C2CC"/>
  <text class="mut" x="660" y="416" text-anchor="middle">여기서부터는 두 흐름이 완전히 같다</text>

  <g>
    <rect class="box" x="20" y="432" width="1280" height="72" stroke="#5B6B79"/>
    <circle cx="52" cy="468" r="14" fill="#5B6B79"/><text class="num" x="52" y="473">3</text>
    <text class="h3" x="76" y="462">검토 의견과, 제안이 반영된 초안이 함께 화면에 뜬다</text>
    <text class="mut" x="76" y="484">AI 의견은 참고용으로만 보여주고, 초안은 바로 고칠 수 있는 텍스트로 채워진다.</text>
  </g>
  <line class="edge" x1="660" y1="504" x2="660" y2="530"/>
  <g>
    <rect class="box" x="20" y="530" width="1280" height="72" stroke="#5B6B79"/>
    <circle cx="52" cy="566" r="14" fill="#5B6B79"/><text class="num" x="52" y="571">4</text>
    <text class="h3" x="76" y="560">사용자가 그대로 두거나 원하는 대로 고친다</text>
    <text class="mut" x="76" y="582">AI 제안을 "적용"하는 버튼은 없다 — 이미 반영된 텍스트를 그냥 편집하는 것이 전부다.</text>
  </g>
  <line class="edge" x1="325" y1="602" x2="325" y2="628"/>
  <line class="edge" x1="995" y1="602" x2="995" y2="628"/>

  <g>
    <rect class="box" x="20" y="628" width="610" height="60" stroke="#2C7A8C"/>
    <circle cx="52" cy="658" r="14" fill="#2C7A8C"/><text class="num" x="52" y="663">5</text>
    <text class="h3" x="76" y="664">등록 완료 — 상태: 접수</text>
  </g>
  <g>
    <rect class="box" x="690" y="628" width="610" height="60" stroke="#C1621B"/>
    <circle cx="722" cy="658" r="14" fill="#C1621B"/><text class="num" x="722" y="663">5</text>
    <text class="h3" x="746" y="664">수정 완료 — 새 버전으로 저장</text>
  </g>

  <!-- ============ SECTION 2 : 검토는 어떻게 진행되나 ============ -->
  <text class="h2" x="30" y="742" fill="#6B4FA0">2. 검토는 어떻게 진행되나</text>
  <text class="mut" x="30" y="762">정해둔 규칙을 먼저 확인하고, 사내 LLM에게 물어봐서 놓친 게 있으면 보충한다.</text>

  <g>
    <rect class="box" x="20" y="778" width="400" height="96" stroke="#2C7A8C"/>
    <text class="h3" x="40" y="804" fill="#1B5E6B">프론트 — 요청</text>
    <text class="body" x="40" y="826">사용자가 입력한 요구사항</text>
    <text class="body" x="40" y="846">내용을 AI 서버로 보낸다</text>
  </g>
  <line class="edge" x1="420" y1="826" x2="460" y2="826"/>

  <g>
    <rect class="box" x="460" y="778" width="400" height="96" stroke="#6B4FA0"/>
    <text class="h3" x="480" y="804" fill="#4A2E7A">AI 서버 — 검토</text>
    <text class="body" x="480" y="826">정해둔 규칙으로 먼저 확인하고,</text>
    <text class="body" x="480" y="846">사내 LLM에게 물어봐서 보충한다</text>
  </g>
  <line class="edge" x1="860" y1="826" x2="900" y2="826"/>

  <g>
    <rect class="box" x="900" y="778" width="400" height="96" stroke="#2C7A8C"/>
    <text class="h3" x="920" y="804" fill="#1B5E6B">프론트 — 응답 받음</text>
    <text class="body" x="920" y="826">검토 의견과, 제안이 반영된</text>
    <text class="body" x="920" y="846">초안을 함께 받는다</text>
  </g>

  <text class="mut" x="30" y="892">※ 사내 LLM이 응답하지 못해도(주소 미설정·연결 실패 등) 검토 자체가 막히지 않는다 — 규칙 결과만으로 그대로 진행된다.</text>

  <!-- ============ SECTION 3 : 규칙 기반 검출 표 ============ -->
  <text class="h2" x="30" y="944" fill="#5B6B79">3. 정해둔 규칙으로 무엇을 찾아내나</text>
  <text class="mut" x="30" y="964">문장 안에 특정 표현이 있으면, 유형별로 미리 준비된 이유·제안을 붙여서 검출한다.</text>

  <g font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">
    <rect x="20" y="980" width="1280" height="40" fill="#5B6B79" rx="8"/>
    <rect x="20" y="1000" width="1280" height="20" fill="#5B6B79"/>
    <text class="th" x="36"  y="1005">검출 유형</text>
    <text class="th" x="236" y="1005">예시 표현</text>
    <text class="th" x="576" y="1005">왜 문제인가</text>
    <text class="th" x="916" y="1005">제안</text>

    <!-- rows -->
    <g>
      <rect x="20" y="1020" width="1280" height="52" fill="#F6F7F9"/>
      <text class="td" x="36" y="1042" font-weight="700">정량 기준 부재</text>
      <text class="td" x="236" y="1042">가용한 AMR · 가장 가까운 · 충분한</text>
      <text class="td" x="576" y="1042">판정 기준(가용·거리·수치)이 없어 사람마다 다르게 해석</text>
      <text class="td" x="916" y="1042">구체적인 기준값으로 명시</text>
      <text class="tdm" x="916" y="1060">예) IDLE 상태이며 SoC 최소값 이상</text>
    </g>
    <g>
      <rect x="20" y="1072" width="1280" height="52" fill="#FFFFFF"/>
      <text class="td" x="36" y="1094" font-weight="700">모호한 정도부사</text>
      <text class="td" x="236" y="1094">적절히 · 적절한</text>
      <text class="td" x="576" y="1094">판단 주체와 기준이 정해져 있지 않음</text>
      <text class="td" x="916" y="1094">구체적인 조정 범위·기준값을 명시</text>
    </g>
    <g>
      <rect x="20" y="1124" width="1280" height="52" fill="#F6F7F9"/>
      <text class="td" x="36" y="1146" font-weight="700">주어·주체 불명확</text>
      <text class="td" x="236" y="1146">관련 부서 · 담당자가</text>
      <text class="td" x="576" y="1146">누가 하는지 특정되지 않아 담당이 불분명함</text>
      <text class="td" x="916" y="1146">담당 조직·역할명을 구체적으로 명시</text>
    </g>
    <g>
      <rect x="20" y="1176" width="1280" height="52" fill="#FFFFFF"/>
      <text class="td" x="36" y="1198" font-weight="700">조건 발생 시점 불명확</text>
      <text class="td" x="236" y="1198">필요 시 · 이상 발생 시</text>
      <text class="td" x="576" y="1198">어떤 조건에서 발생하는지가 정의되지 않음</text>
      <text class="td" x="916" y="1198">판정 가능한 조건으로 명시</text>
      <text class="tdm" x="916" y="1216">예) 알람 코드 E-1xx 수신 시</text>
    </g>
    <g>
      <rect x="20" y="1228" width="1280" height="52" fill="#F6F7F9"/>
      <text class="td" x="36" y="1250" font-weight="700">예외·경계 조건 누락</text>
      <text class="td" x="236" y="1250">"~경우에만"처럼 조건은 있는데</text>
      <text class="tdm" x="236" y="1266">예외 처리 언급이 없는 문장</text>
      <text class="td" x="576" y="1250">조건을 만족하지 못하는 경우의 동작이 정의되지 않음</text>
      <text class="td" x="916" y="1250">조건 불충족 시 동작(거부·대기·알림 등)도 함께 명시</text>
    </g>
    <g>
      <rect x="20" y="1280" width="1280" height="52" fill="#FFFFFF"/>
      <text class="td" x="36" y="1302" font-weight="700">접속사 범위 모호</text>
      <text class="td" x="236" y="1302">등을 · 및</text>
      <text class="td" x="576" y="1302">묶거나 포함하는 범위가 어디까지인지 열려 있음</text>
      <text class="td" x="916" y="1302">대상을 나열하거나 문장을 분리해서 범위를 한정</text>
    </g>
    <g>
      <rect x="20" y="1332" width="1280" height="52" fill="#F6F7F9"/>
      <text class="td" x="36" y="1354" font-weight="700">시간·일정 모호</text>
      <text class="td" x="236" y="1354">신속히 · 즉시 · 가능한 한 빠르게</text>
      <text class="tdm" x="236" y="1370">주기적으로</text>
      <text class="td" x="576" y="1354">처리 시간·주기가 수치로 정해져 있지 않음</text>
      <text class="td" x="916" y="1354">시간·주기를 수치로 명시</text>
      <text class="tdm" x="916" y="1372">예) 이상 감지 후 5분 이내 · 10초 간격</text>
    </g>
    <g>
      <rect x="20" y="1384" width="1280" height="66" fill="#FBEAEA"/>
      <text class="td" x="36" y="1406" font-weight="700" fill="#8A2020">기존 요구사항과 상충</text>
      <text class="td" x="236" y="1406">같은 프로젝트 다른 요구사항과</text>
      <text class="tdm" x="236" y="1422">비교해서 검출</text>
      <text class="td" x="576" y="1406">같은 기준(예: 선택 순서)을 서로 다른 값으로 정하고 있음</text>
      <text class="tdm" x="576" y="1424">문장만 고쳐서는 해결되지 않는다</text>
      <text class="td" x="916" y="1406">기준을 하나로 통일 — 고객과 협의 필요</text>
    </g>
    <rect x="20" y="980" width="1280" height="470" fill="none" stroke="#D9DEE5" stroke-width="1.5" rx="8"/>
  </g>

  <!-- 상충 판정 예시 -->
  <rect x="20" y="1462" width="1280" height="86" rx="10" fill="#FBEAEA" stroke="#E4AFAF"/>
  <text class="h3" x="36" y="1486" fill="#8A2020">상충은 표현이 달라도 뜻이 같으면 매칭한다 — 예: "선택·우선순위 기준"</text>
  <text class="td" x="36" y="1510">요청 순 (요청순·접수 순·선착순)</text>
  <text class="td" x="356" y="1510">거리 순 (가장 가까운·최단 거리·최단 경로)</text>
  <text class="td" x="756" y="1510">배터리 잔량 순 (SoC 높은 순)</text>
  <text class="td" x="1056" y="1510">등록 순</text>
  <text class="mut" x="36" y="1534">→ 이 네 가지 중 서로 다른 값을 쓰는 두 요구사항이 있으면 "상충"으로 검출한다.</text>

  <!-- ============ SECTION 4 : AI에게 보내는 지시사항 ============ -->
  <text class="h2" x="30" y="1592" fill="#9A6B12">4. LLM을 쓸 때 — AI에게 이렇게 요청한다</text>
  <text class="mut" x="30" y="1612">규칙만으로는 못 잡는 것까지 봐 달라고, LLM에게 아래 내용을 함께 전달한다.</text>

  <rect x="20" y="1628" width="1280" height="230" rx="14" fill="#FBF2DD" stroke="#D9B25A"/>
  <text class="h3" x="52" y="1660" fill="#7A5A0E">역할</text>
  <text class="body" x="140" y="1660">"반도체 장비 소프트웨어(VCS/AMR) 요구사항을 검토하는 전문가"라고 알려준다.</text>

  <text class="h3" x="52" y="1692" fill="#7A5A0E">미션</text>
  <text class="body" x="140" y="1692">"개발자와 고객이 서로 다르게 해석할 수 있는 부분을 찾아라"고 지시한다.</text>

  <text class="h3" x="52" y="1724" fill="#7A5A0E">찾아야 할 유형</text>
  <text class="body" x="140" y="1724">위 3번 표의 검출 유형 7가지(상충 제외) 중에서만 고르게 한다.</text>

  <text class="h3" x="52" y="1756" fill="#7A5A0E">지켜야 할 규칙</text>
  <text class="body" x="140" y="1756">"문제 구절은 반드시 원문에 실제로 있는 표현이어야 한다" — 없는 말을 지어내지 못하게</text>
  <text class="body" x="140" y="1774">막는 안전장치. 이걸 어긴 답은 검토 결과에서 자동으로 제외된다.</text>

  <text class="h3" x="52" y="1806" fill="#7A5A0E">함께 보내는 것</text>
  <text class="body" x="180" y="1806">검토할 요구사항 내용 (확정본 수정인 경우, 사용자가 입력한 수정 사유도 같이).</text>

  <text class="mut" x="52" y="1838">↳ 이 지시사항은 코드 안에 고정 문구로 들어 있어서, 검토 기준을 바꾸고 싶으면 이 문구만 수정하면 된다.</text>

  <text class="h3" x="30" y="1892" fill="#1B2A4A">LLM이 돌려주는 답 — 결과에서 쓰는 4가지</text>
  <g>
    <rect x="20" y="1904" width="1280" height="40" fill="#5B6B79" rx="8"/>
