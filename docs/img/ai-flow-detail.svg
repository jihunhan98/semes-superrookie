  <!-- ============ SECTION 5 : 화면 표시 ============ -->
  <text class="h2" x="30" y="2168" fill="#2A8A57">5. 화면에는 이렇게 나타난다</text>
  <text class="mut" x="30" y="2188">검토가 끝나면 좌우 두 카드로 나뉘어 보인다.</text>

  <rect x="20" y="2204" width="622" height="132" rx="10" fill="#F1F8FA" stroke="#9FCBD3"/>
  <text class="h3" x="40" y="2230" fill="#1B5E6B">AI 검토 결과 — 참고만, 버튼 없음</text>
  <text class="body" x="40" y="2254">검출된 유형·구절·이유·제안을 그대로 나열만 한다.</text>
  <text class="body" x="40" y="2274">"적용" 버튼이 없다 — 적용은 오른쪽 카드에 이미 반영되어 있다.</text>
  <text class="mut" x="40" y="2300">배지로 사내 LLM이 검토에 응답했는지(사내 LLM / AI 미응답)도 보여준다.</text>
  <text class="mut" x="40" y="2318">검출이 0건이어도 "문제 없음"과 "AI가 못 봤음"은 다른 문구로 구분해서 알려준다.</text>

  <rect x="678" y="2204" width="622" height="132" rx="10" fill="#EAF3EC" stroke="#9FCBAA"/>
  <text class="h3" x="698" y="2230" fill="#1F5E38">확정될 본문 — 여기서만 편집</text>
  <text class="body" x="698" y="2254">제안이 이미 반영된 문장으로 미리 채워져 있다.</text>
  <text class="body" x="698" y="2274">그대로 두거나 자유롭게 고치면 그게 곧 "제안 적용 여부"다.</text>
  <text class="mut" x="698" y="2300">"등록 원문으로 되돌리기"로 처음 입력한 문장으로 언제든 되돌릴 수 있다.</text>
  <text class="mut" x="698" y="2318">마음에 안 들면 "다시 분석"으로 처음부터 다시 검토를 받을 수 있다.</text>

  <!-- ============ SECTION 6 : 고객 협의 → 확정 ============ -->
  <rect x="20" y="2372" width="1280" height="30" rx="15" fill="#9A6B12"/>
  <text class="pill" x="660" y="2392">설계 완료 · 개발 예정</text>
  <text class="h2" x="30" y="2436" fill="#9A6B12">6. 화면을 본 다음 — 고객과 협의해서 확정한다</text>
  <text class="mut" x="30" y="2456">AI 의견을 참고해서 초안을 손본 뒤에도, 확정은 반드시 고객과의 협의를 거쳐야 한다.</text>

