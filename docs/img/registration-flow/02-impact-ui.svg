<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-label="02  영향 발견 후 사용자가 보는 화면"><style>text{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#172b4d} .small{font-size:15px} .label{font-size:17px;font-weight:600} .body{font-size:19px} .title{font-size:28px;font-weight:700}</style><rect width="1120" height="100%" fill="#f3f6fc"/><text x="36" y="47" class="title">02  영향 발견 후 사용자가 보는 화면</text><text x="36" y="78" class="small">현재 ImpactNotice·InsightsPage 구성에 따른 설명용 UI · 판정 내용은 예시</text><rect x="30" y="104" width="1060" height="54" rx="14" fill="#fff" stroke="#dce4f2"/><text x="50" y="138" class="label">ReqOps Agent / AMR 프로젝트</text><rect x="859" y="111" width="205" height="40" rx="14" fill="#2563eb" stroke="#dce4f2"/><text x="873" y="137" class="small" style="fill:#fff">변경 영향 1건</text><rect x="30" y="178" width="1060" height="636" rx="14" fill="#fff" stroke="#dce4f2"/><text x="54" y="221" class="title">변경 영향과 코드 근거</text><text x="897" y="220" class="label">미확인 1건</text><text x="54" y="263" class="label" style="fill:#2563eb">변경 영향     |     코드 근거</text><rect x="54" y="284" width="1012" height="113" rx="14" fill="#f5f8ff" stroke="#dce4f2"/><text x="74" y="316" class="small" style="fill:#2563eb">예상 영향 · req-amr-010</text><text x="74" y="348" class="label">SOC 배정 기준 30% 적용 시 기존 조건 확인 필요</text><text x="74" y="377" class="small">변경 전: 신규 등록    /    변경 후: 입력한 새 요구사항 본문</text><rect x="54" y="417" width="1012" height="229" rx="14" fill="#fff" stroke="#dce4f2"/><text x="76" y="453" class="label">req-amr-008</text><text x="867" y="453" class="label" style="fill:#b45309">수정 검토 필요</text><text x="76" y="490" class="title" style="fill:#2563eb">추가 → 30% 이상</text><text x="76" y="529" class="body">“SOC 50% 이상인 AMR을 작업 배정 후보로 선정한다.”</text><text x="76" y="568" class="label">영향 이유  30% 이상 50% 미만 AMR이 여전히 후보에서 제외됩니다.</text><text x="76" y="604" class="small">수정 제안  후보 선정 기준을 30% 이상으로 맞출지 검토합니다.</text><rect x="841" y="590" width="201" height="40" rx="14" fill="#f5f8ff" stroke="#dce4f2"/><text x="855" y="616" class="small" style="fill:#2157af">대상 요구사항 열기</text><text x="76" y="683" class="small">영향 없음 판정 보기  ▸  req-amr-020 충전 정책은 별도로 판단</text><text x="76" y="714" class="small">req-amr-001 원래 배정 정책도 별도 대상 카드로 검토될 수 있습니다.</text><rect x="76" y="744" width="170" height="40" rx="14" fill="#f5f8ff" stroke="#dce4f2"/><text x="90" y="770" class="small" style="fill:#2157af">읽음으로 표시</text><text x="267" y="772" class="small">읽음은 수정 완료와 다릅니다. 기존 본문은 자동 변경되지 않습니다.</text></svg>