<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-label="03  보완 필요: 초기 본문 검토 결과의 자동 갱신"><style>text{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#172b4d} .small{font-size:15px} .label{font-size:17px;font-weight:600} .body{font-size:19px} .title{font-size:28px;font-weight:700}</style><rect width="1120" height="100%" fill="#f3f6fc"/><text x="36" y="47" class="title">03  보완 필요: 초기 본문 검토 결과의 자동 갱신</text><text x="36" y="78" class="small">왼쪽은 현재 발생 가능한 상황 · 오른쪽은 아직 구현하지 않은 보완 UI 제안</text><rect x="30" y="114" width="515" height="470" rx="14" fill="#fff8f1" stroke="#dce4f2"/><text x="52" y="154" class="label">현재: 결과 저장 전에 화면 진입</text><rect x="575" y="114" width="515" height="470" rx="14" fill="#eff8f3" stroke="#dce4f2"/><text x="597" y="154" class="label">보완안: 작업 완료를 확인한 뒤 표시</text><rect x="52" y="180" width="471" height="202" rx="14" fill="#fff" stroke="#dce4f2"/><text x="73" y="221" class="label">원문 내 검출 결과</text><text x="73" y="266" class="body">확인을 요구하는 문제가 없습니다.</text><text x="73" y="309" class="small">하지만 초기 ANALYZE가 아직 처리 중이면</text><text x="73" y="339" class="small">이 빈 결과를 검토 완료로 오해할 수 있습니다.</text><text x="52" y="425" class="label">화면 진입 시 1회 조회</text><text x="52" y="467" class="small">초기 작업 완료 후 자동 재조회 없음</text><text x="52" y="501" class="small">새로고침 또는 AI 재검토로 확인</text><text x="52" y="535" class="small">대기·실패·완료 상태를 먼저 구분해야 함</text><rect x="597" y="180" width="471" height="202" rx="14" fill="#fff" stroke="#dce4f2"/><text x="618" y="221" class="label" style="fill:#2563eb">본문 검토 중 · 결과를 기다리고 있습니다.</text><text x="618" y="266" class="small">본문 검토: 처리 중     영향 분석: 대기</text><text x="618" y="309" class="small">완료 후 검출 결과를 자동 갱신합니다.</text><text x="618" y="339" class="small">직접 수정한 본문은 덮어쓰지 않습니다.</text><text x="597" y="425" class="label">보완할 동작</text><text x="597" y="467" class="small">작업 상태 조회 → 완료 후 결과 재조회</text><text x="597" y="501" class="small">unavailable·규칙 검토·LLM 완료 구분</text><text x="597" y="535" class="small">진행 중 중복 재검토·늦은 결과 반영 방지</text></svg>