<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="775" viewBox="0 0 1120 775" role="img" aria-label="01  등록과 두 검토 작업"><style>text{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#172b4d} .small{font-size:15px} .label{font-size:17px;font-weight:600} .body{font-size:19px} .title{font-size:28px;font-weight:700}</style><rect width="1120" height="100%" fill="#f3f6fc"/><text x="36" y="47" class="title">01  등록과 두 검토 작업</text><text x="36" y="78" class="small">현재 소스에 따른 설명용 UI 재구성 · 실제 실행 캡처 아님</text><rect x="30" y="104" width="1060" height="52" rx="14" fill="#fff" stroke="#dce4f2"/><text x="50" y="137" class="label">ReqOps Agent / AMR 프로젝트</text><rect x="843" y="110" width="225" height="40" rx="14" fill="#f5f8ff" stroke="#dce4f2"/><text x="857" y="136" class="small" style="fill:#2157af">AI 영향 분석 중</text><rect x="30" y="176" width="665" height="480" rx="14" fill="#fff" stroke="#dce4f2"/><text x="54" y="214" class="title">새 요구사항 등록</text><text x="54" y="253" class="small">요구사항 ID</text><rect x="54" y="266" width="615" height="46" rx="14" fill="#f8faff" stroke="#dce4f2"/><text x="70" y="296" class="body">req-amr-010</text><text x="54" y="341" class="small">요구사항 내용</text><rect x="54" y="354" width="615" height="132" rx="14" fill="#f8faff" stroke="#dce4f2"/><text x="70" y="388" class="body">작업 배정 최소 SOC 기준을</text><text x="70" y="418" class="body">50% 이상에서 30% 이상으로 변경한다.</text><text x="70" y="448" class="body">후보가 없으면 기존 대기 정책을 따른다.</text><rect x="54" y="509" width="200" height="40" rx="14" fill="#2563eb" stroke="#dce4f2"/><text x="68" y="535" class="small" style="fill:#fff">등록하고 AI 검토</text><text x="54" y="590" class="small">실제 순서: 본문 저장 → 작업 생성 → 첨부 업로드</text><text x="54" y="620" class="small">이후 2단계 검토 화면으로 이동</text><rect x="715" y="176" width="375" height="220" rx="14" fill="#eef4ff" stroke="#dce4f2"/><text x="739" y="214" class="label">A. 본문 검토 / ANALYZE</text><text x="739" y="253" class="body">모호한 표현·조건·예외 확인</text><text x="739" y="291" class="body">규칙 검출 + LLM 보충</text><text x="739" y="329" class="body">결과: 검출 카드·수정 초안</text><rect x="715" y="416" width="375" height="240" rx="14" fill="#eef8f6" stroke="#dce4f2"/><text x="739" y="454" class="label">B. 영향 분석 / IMPACT</text><text x="739" y="493" class="body">다른 요구사항 전부 비교</text><text x="739" y="531" class="body">IMPACT / NONE / UNKNOWN</text><text x="739" y="569" class="body">결과: 상단 알림·영향 목록</text><rect x="30" y="678" width="1060" height="67" rx="14" fill="#fff4e5" stroke="#f2ce92"/><text x="50" y="706" class="label">주의: 저장 완료는 AI 분석 완료가 아닙니다.</text><text x="50" y="733" class="small">두 작업은 별도로 큐에서 처리됩니다. 초기 본문 결과의 자동 갱신은 보완이 필요합니다.</text></svg>