<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-label="04  보완 필요: 첨부 입력과 현장 검증"><style>text{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;fill:#172b4d} .small{font-size:15px} .label{font-size:17px;font-weight:600} .body{font-size:19px} .title{font-size:28px;font-weight:700}</style><rect width="1120" height="100%" fill="#f3f6fc"/><text x="36" y="47" class="title">04  보완 필요: 첨부 입력과 현장 검증</text><text x="36" y="78" class="small">현재 흐름과 보완 방향을 설명하는 그림 · 보완안은 아직 구현되지 않음</text><rect x="30" y="114" width="1060" height="245" rx="14" fill="#fff" stroke="#dce4f2"/><text x="52" y="155" class="label">현재 등록 순서</text><text x="52" y="198" class="body">① 본문 저장과 ANALYZE·IMPACT 작업 생성</text><text x="52" y="238" class="body">② 그 뒤 TXT / PDF / DOCX 업로드</text><text x="52" y="278" class="body">③ 파일은 저장·추출할 수 있지만 초기 두 작업 입력에는 추출문이 없음</text><text x="52" y="333" class="label" style="fill:#b45309">첨부에만 있는 “SOC 30%”를 초기 AI가 읽었다고 판단하면 안 됩니다.</text><rect x="30" y="381" width="1060" height="180" rx="14" fill="#eef4ff" stroke="#dce4f2"/><text x="52" y="422" class="label">보완 방향: 분석할 자료 묶음을 먼저 고정</text><text x="52" y="463" class="body">파일 업로드·추출 상태 확인 → 본문+추출문 스냅샷 → AI 작업 생성</text><text x="52" y="503" class="body">추출 실패·스캔 PDF는 미포함 사실 안내 / 필요 시 OCR 또는 본문 입력 요청</text><rect x="30" y="583" width="1060" height="137" rx="14" fill="#eff8f3" stroke="#dce4f2"/><text x="52" y="623" class="label">현장 확인: 실제 LLM + Oracle + standalone 화면으로 연결 확인</text><text x="52" y="662" class="body">SOC 변경·정확한 경계값·영향 없음·근거 부족·AI 실패·결과 만료를 시험합니다.</text><text x="52" y="694" class="small">판정 JSON과 저장된 작업·UI 알림까지 비교해야 통합 완료로 볼 수 있습니다.</text></svg>