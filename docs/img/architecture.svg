<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7d8a99"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke-width:2; rx:12; }
      .tt   { font-size:21px; font-weight:700; text-anchor:middle; }
      .sub  { font-size:13px; fill:#63707E; text-anchor:middle; }
      .lbl  { font-size:12px; fill:#4a5663; text-anchor:middle; }
      .edge { stroke:#7d8a99; stroke-width:2; fill:none; }
    </style>
  </defs>

  <!-- title -->
  <text x="30" y="42" font-size="26" font-weight="800" fill="#1B2A4A">시스템 아키텍처</text>
  <text x="30" y="66" font-size="14" fill="#63707E">React → Spring Boot → AI 서버 · Oracle DB — 전 구성요소는 사내 폐쇄망 안에서 동작</text>

  <!-- closed-network boundary -->
  <rect x="28" y="86" width="984" height="474" rx="16" fill="#f5f8fb" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="52" y="78" width="290" height="20" fill="#ffffff"/>
  <text x="60" y="93" font-size="13" font-weight="700" fill="#1B2A4A" font-family="monospace">사내 폐쇄망 · 반출(외부 전송) 차단</text>

  <!-- Row 1 -->
  <!-- React -->
  <rect class="box" x="55" y="150" width="250" height="115" rx="12" stroke="#2C7A8C"/>
  <text class="tt" x="180" y="200" fill="#2C7A8C">React</text>
  <text class="sub" x="180" y="228">프론트엔드 (웹 UI)</text>

  <!-- Spring Boot -->
  <rect class="box" x="395" y="150" width="250" height="115" rx="12" stroke="#2A8A57"/>
  <text class="tt" x="520" y="200" fill="#2A8A57">Spring Boot</text>
  <text class="sub" x="520" y="228">백엔드 (REST API)</text>

  <!-- AI server -->
  <rect class="box" x="735" y="150" width="250" height="115" rx="12" stroke="#C67F17"/>
  <text class="tt" x="860" y="196" fill="#C67F17">AI 서버 (FastAPI)</text>
  <text class="sub" x="860" y="224">Qwen3-8B (로컬 LLM)</text>
  <text class="sub" x="860" y="244" font-size="12" fill="#8a96a3">모호성 검출 · 기능 도출</text>

  <!-- Row 2 -->
  <!-- Liquibase note (백엔드가 DB 스키마 적용에 쓰는 도구) -->
  <text x="70" y="424" font-size="15" font-weight="700" fill="#6B4C9A">Liquibase</text>
  <text x="70" y="450" font-size="13" fill="#63707E">Spring Boot가 DB에 스키마를</text>
  <text x="70" y="470" font-size="13" fill="#63707E">적용할 때 쓰는 도구</text>
  <text x="70" y="490" font-size="13" fill="#63707E">(최종 changelog → 개인 스키마 pull)</text>

  <!-- Oracle DB -->
  <rect class="box" x="395" y="380" width="250" height="115" rx="12" stroke="#B23B2E"/>
  <text class="tt" x="520" y="430" fill="#B23B2E">Oracle DB</text>
  <text class="sub" x="520" y="458">개인 스키마 / 최종 스키마</text>

  <!-- edges -->
  <!-- React -> Spring -->
  <line class="edge" x1="305" y1="207" x2="388" y2="207" marker-end="url(#arrow)"/>
  <text class="lbl" x="346" y="197">REST</text>
  <!-- Spring -> AI -->
  <line class="edge" x1="645" y1="207" x2="728" y2="207" marker-end="url(#arrow)"/>
  <text class="lbl" x="686" y="197">분석요청</text>
  <!-- Spring -> Oracle (JDBC + Liquibase) -->
  <line class="edge" x1="520" y1="265" x2="520" y2="373" marker-end="url(#arrow)"/>
  <text class="lbl" x="533" y="306" text-anchor="start" font-weight="700">JDBC · Liquibase</text>
  <text class="lbl" x="533" y="325" text-anchor="start" fill="#63707E">스키마 마이그레이션(pull)</text>

  <!-- hardware note -->
  <text x="520" y="537" font-size="13" fill="#63707E" text-anchor="middle">워크스테이션: Quadro P4000 8GB · Xeon Gold 5122 · RAM 32GB</text>
</svg>
