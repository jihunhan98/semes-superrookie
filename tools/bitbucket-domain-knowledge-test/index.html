<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Bitbucket Server 연결 테스트</title>
<style>
  :root{--line:#d1d9e0;--muted:#59636e;--ink:#1f2328;--bg:#f6f8fa;--accent:#0969da;--ok:#1a7f37;--err:#cf222e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;padding:32px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  .row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .field{flex:1;min-width:180px}
  .field.small{flex:0 0 140px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
  input{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--accent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--bg)}
  button:disabled{opacity:.5;cursor:default}
  .result{margin-top:10px}
  .result h3{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:700}
  pre{background:#0d1117;color:#c9d1d9;border-radius:8px;padding:12px 14px;overflow:auto;max-height:360px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .ok{color:var(--ok);font-weight:700}
  .err{color:var(--err);font-weight:700;white-space:pre-wrap}
  .chiplist{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;background:#fff}
  .chip:hover{background:var(--bg)}
  .filerow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 2px;font-size:12.5px;cursor:pointer}
  .filerow:hover{background:var(--bg)}
  .filerow .type{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bitbucket Server 연결 테스트</h1>
  <p class="sub">
    도메인 지식 추출 기능을 만들기 전에, 이 사내망에서 Bitbucket Server REST API로
    브랜치·파일을 실제로 가져올 수 있는지만 먼저 확인하는 용도입니다.
  </p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Base URL</label>
        <input id="baseUrl" value="http://bit-stms.semes.com:17990" placeholder="http://bit-stms.semes.com:17990">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>프로젝트 키 (Project Key)</label>
        <input id="projectKey" placeholder="예: VCS">
      </div>
      <div class="field">
        <label>레포 슬러그 (Repository Slug)</label>
        <input id="repoSlug" placeholder="예: amr-controller">
      </div>
      <div class="field small">
        <label>브랜치 (선택)</label>
        <input id="branch" placeholder="비우면 기본 브랜치">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Personal Access Token</label>
        <input id="token" type="password" placeholder="Bitbucket 개인 설정 → HTTP access tokens에서 발급">
      </div>
    </div>
    <div class="actions">
      <button id="btnBranches">1. 브랜치 목록 가져오기</button>
      <button id="btnBrowse">2. 루트 디렉터리 목록 보기</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>파일 경로 (레포 루트 기준)</label>
        <input id="filePath" placeholder="예: src/main/java/com/semes/amr/BatteryMonitor.java">
      </div>
    </div>
    <div class="actions">
      <button id="btnFile">3. 이 경로의 파일 내용 가져오기</button>
    </div>
  </div>

  <div class="card">
    <div class="result" id="resultBranches" hidden>
      <h3>브랜치 목록</h3>
      <div class="chiplist" id="branchChips"></div>
    </div>
    <div class="result" id="resultBrowse" hidden>
      <h3>루트 디렉터리</h3>
      <div id="browseList"></div>
    </div>
    <div class="result" id="resultFile" hidden>
      <h3>파일 내용</h3>
      <div id="fileMeta"></div>
      <pre id="fileContent"></pre>
    </div>
    <div class="result" id="resultError" hidden>
      <h3>오류</h3>
      <div class="err" id="errorText"></div>
    </div>
  </div>
</div>

<script>
function common() {
  return {
    baseUrl: document.getElementById('baseUrl').value.trim(),
    projectKey: document.getElementById('projectKey').value.trim(),
    repoSlug: document.getElementById('repoSlug').value.trim(),
    token: document.getElementById('token').value.trim(),
    branch: document.getElementById('branch').value.trim(),
  };
}

function showError(msg) {
  document.getElementById('resultError').hidden = false;
  document.getElementById('errorText').textContent = msg;
}

function clearError() {
  document.getElementById('resultError').hidden = true;
}

async function callApi(path, extra) {
  clearError();
  const body = Object.assign(common(), extra || {});
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) {
    showError(data.error || '알 수 없는 오류');
    return null;
  }
  return data;
}

document.getElementById('btnBranches').onclick = async () => {
  const data = await callApi('/api/branches');
  if (!data) return;
  document.getElementById('resultBranches').hidden = false;
  const wrap = document.getElementById('branchChips');
  wrap.innerHTML = '';
  data.branches.forEach((name) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = name;
    chip.onclick = () => { document.getElementById('branch').value = name; };
    wrap.appendChild(chip);
  });
  if (data.branches.length === 0) wrap.textContent = '브랜치가 없습니다.';
};

document.getElementById('btnBrowse').onclick = async () => {
  const data = await callApi('/api/browse', { path: '' });
  if (!data) return;
  document.getElementById('resultBrowse').hidden = false;
  const wrap = document.getElementById('browseList');
  wrap.innerHTML = '';
  data.entries.forEach((entry) => {
    const row = document.createElement('div');
    row.className = 'filerow';
    row.innerHTML = `<span>${entry.path}</span><span class="type">${entry.type}</span>`;
    if (entry.type === 'FILE') {
      row.onclick = () => { document.getElementById('filePath').value = entry.path; };
    }
    wrap.appendChild(row);
  });
  if (data.entries.length === 0) wrap.textContent = '파일이 없습니다.';
};

document.getElementById('btnFile').onclick = async () => {
  const path = document.getElementById('filePath').value.trim();
  const data = await callApi('/api/file', { path });
  if (!data) return;
  document.getElementById('resultFile').hidden = false;
  document.getElementById('fileMeta').innerHTML =
    `<span class="ok">성공</span> · ${data.bytes} bytes`;
  document.getElementById('fileContent').textContent = data.content;
};
</script>
</body>
</html>
