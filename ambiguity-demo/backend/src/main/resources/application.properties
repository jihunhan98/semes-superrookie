server.port=8080
spring.application.name=reqauto-backend

# AI 서버(FastAPI) 주소 — 모호성 판정을 위임
ai.server.url=http://localhost:8001

# Swagger UI: http://localhost:8080/swagger-ui.html  (API 문서: /v3/api-docs)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# 프론트(React :3000) 허용 오리진
app.cors.allowed-origin=http://localhost:3000
