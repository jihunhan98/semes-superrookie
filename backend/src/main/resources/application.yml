spring:
  datasource:
    # Oracle XE 기준. 서비스명(XEPDB1)·포트·계정은 환경에 맞게 수정.
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: reqops
    password: ReqOps#2026
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
